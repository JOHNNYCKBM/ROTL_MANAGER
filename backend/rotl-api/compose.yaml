services:
  postgres:
    image: postgres:16-alpine
    container_name: rotl-manager-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: rotl_manager
      POSTGRES_USER: ${DB_USERNAME:-rotl}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-rotl_local_only}
    ports:
      - "5432:5432"
    volumes:
      - rotl_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-rotl} -d rotl_manager"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  rotl_postgres_data: