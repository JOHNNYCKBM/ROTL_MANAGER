spring.application.name=rotl-manager-api
server.port=${SERVER_PORT:8080}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/rotl_manager}
spring.datasource.username=${DB_USERNAME:rotl}
spring.datasource.password=${DB_PASSWORD:rotl_local_only}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
# JWT secret is mandatory; provide a random value of at least 32 bytes via environment.
security.jwt.secret=${JWT_SECRET}
security.jwt.access-token-minutes=${JWT_ACCESS_TOKEN_MINUTES:15}
